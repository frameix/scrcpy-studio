[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrcpy-studio"
version = "1.0.0"
description = "Modern Wayland-native GTK4/Libadwaita Studio and Controller for Android via scrcpy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "frameix" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]

[project.urls]
Homepage = "https://github.com/frameix/scrcpy-studio"
Repository = "https://github.com/frameix/scrcpy-studio.git"

[project.scripts]
scrcpy-studio = "scrcpy_studio.main:main"

[tool.setuptools.packages.find]
include = ["scrcpy_studio*"]
